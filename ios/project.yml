name: WorkoutImporter
options:
  bundleIdPrefix: com.matheusgoncalves.workoutimporter
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  WorkoutImporter:
    type: application
    platform: iOS
    sources:
      - path: WorkoutImporter
    info:
      path: WorkoutImporter/App/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: "WorkoutImporter uses HealthKit to schedule structured workouts on your Apple Watch."
        NSHealthUpdateUsageDescription: "WorkoutImporter uses HealthKit to schedule structured workouts on your Apple Watch."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - workoutimporter
            CFBundleURLName: com.matheusgoncalves.workoutimporter.garmin-oauth
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: WorkoutImporter/App/WorkoutImporter.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matheusgoncalves.workoutimporter
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  WorkoutImporter:
    build:
      targets:
        WorkoutImporter: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
