<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Returning to Workout Importer…</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 480px; margin: 80px auto; padding: 0 20px; line-height: 1.6; text-align: center; }
  a { color: #0a66c2; }
</style>
</head>
<body>
  <p>Finishing Garmin sign-in&hellip;</p>
  <p id="fallback" style="display:none;">
    If nothing happens, <a id="appLink" href="#">tap here to return to the app</a>.
  </p>
  <script>
    var appUrl = "workoutimporter://oauth-callback" + window.location.search;
    document.getElementById('appLink').href = appUrl;
    window.location.replace(appUrl);
    setTimeout(function () {
      document.getElementById('fallback').style.display = 'block';
    }, 1500);
  </script>
</body>
</html>
